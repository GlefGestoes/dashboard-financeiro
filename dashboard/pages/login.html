<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Corporativo</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card card">
            <div class="logo">
                <div class="logo-box"></div>
                <h1>ERP<span>Finance</span></h1>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" required placeholder="admin@empresa.com.br">
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <div class="options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember"> Lembrar acesso
                    </label>
                    <a href="#" class="forgot-pwd">Recuperar senha</a>
                </div>
                <button type="submit" class="btn btn-login" id="btn-submit">Entrar</button>
            </form>
        </div>
    </div>
    <script src="../js/theme.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
