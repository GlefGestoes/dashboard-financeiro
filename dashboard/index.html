<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando - ERP Finance</title>
    <!-- Redirecionamento automático via HTML -->
    <meta http-equiv="refresh" content="0; url=pages/login.html">
    <style>
        body {
            background-color: #f4f5f7;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1a1a1a;
        }
        /* Loader simples para caso o redirect demore milissegundos */
        .loader {
            border: 4px solid #e0e0e0;
            border-top: 4px solid #800020; /* Vermelho bordô */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    
    <!-- Fallback em JS caso a meta tag falhe em algum navegador -->
    <script>
        window.location.replace("pages/login.html");
    </script>
</body>
</html>
