<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glef-Gestão Financeiro</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/financeiro.css">
</head>
<body>

<div class="sidebar-backdrop"></div>

<div class="app-container">

    <!-- ── Sidebar ── -->
    <nav class="sidebar" role="navigation" aria-label="Menu principal">
        <div class="sidebar-header">
            <div class="logo-mark">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
            </div>
            <div class="sidebar-brand">
                <strong>Glef-Gestões Inteligentes</strong>
                <span>Financeiro</span>
            </div>
        </div>

        <div class="nav-section">
            <div class="nav-group">
                <div class="nav-group-label">Principal</div>
                <ul class="nav-links">
                    <li>
                        <a href="dashboard.html">
                            <span class="nav-icon"><i class="icon-render" data-icon="dash"></i></span>
                            <span class="nav-label">Dashboard</span>
                            <span class="nav-tooltip">Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="financeiro.html" class="active" aria-current="page">
                            <span class="nav-icon"><i class="icon-render" data-icon="fin"></i></span>
                            <span class="nav-label">Financeiro</span>
                            <span class="nav-tooltip">Financeiro</span>
                        </a>
                    </li>
                    <li>
                        <a href="contabil.html">
                            <span class="nav-icon"><i class="icon-render" data-icon="cont"></i></span>
                            <span class="nav-label">Contábil</span>
                            <span class="nav-tooltip">Contábil</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="sidebar-footer">
            <ul class="nav-links">
                <li>
                    <a href="login.html">
                        <span class="nav-icon"><i class="icon-render" data-icon="logout"></i></span>
                        <span class="nav-label">Sair</span>
                        <span class="nav-tooltip">Sair</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- ── Conteúdo Principal ── -->
    <div class="main-content">

        <!-- Topbar -->
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:var(--space-4)">
                <button class="btn-icon menu-toggle" aria-label="Abrir menu">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div class="topbar-left">
                    <h1 class="topbar-title">Gestão Financeira</h1>
                    <p class="topbar-subtitle">Contas a pagar e receber · Outubro 2026</p>
                </div>
            </div>
            <div class="topbar-actions">
                <button class="btn btn-primary" id="btn-novo">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <span class="btn-mobile-hide">Novo Lançamento</span>
                </button>
                <button class="theme-toggle" id="theme-toggle" title="Alternar tema" aria-label="Alternar tema"></button>
                <div class="avatar" title="Administrador">AD</div>
            </div>
        </header>

        <!-- Conteúdo -->
        <main class="page-content">

            <!-- Filtros -->
            <div class="card filter-card animate-in">
                <div class="filter-grid">
                    <div>
                        <label class="filter-label">Buscar</label>
                        <div class="input-with-icon">
                            <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                            <input type="text" id="search-nome" placeholder="Cliente, fornecedor ou documento...">
                        </div>
                    </div>
                    <div>
                        <label class="filter-label">Status</label>
                        <select id="filtro-status">
                            <option value="">Todos os status</option>
                            <option value="Pago">Pago</option>
                            <option value="Pendente">Pendente</option>
                            <option value="Vencido">Vencido</option>
                        </select>
                    </div>
                    <div>
                        <label class="filter-label">Data inicial</label>
                        <input type="date" id="data-inicio" title="Data Inicial">
                    </div>
                    <div>
                        <label class="filter-label">Data final</label>
                        <input type="date" id="data-fim" title="Data Final">
                    </div>
                    <div style="display:flex;align-items:flex-end">
                        <button class="btn btn-outline" id="btn-filtrar" style="width:100%">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                            Filtrar
                        </button>
                    </div>
                    <div style="display:flex;align-items:flex-end">
                        <button class="btn btn-outline" id="btn-export" style="width:100%">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Exportar PDF
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs animate-in animate-in-delay-1">
                <button class="tab-btn active" data-tab="pagar">
                    Contas a Pagar
                </button>
                <button class="tab-btn" data-tab="receber">
                    Contas a Receber
                </button>
            </div>

            <!-- Tabela -->
            <div class="card animate-in animate-in-delay-2">
                <div class="table-container">
                    <table id="finance-table">
                        <thead>
                            <tr>
                                <th>Vencimento</th>
                                <th>Documento</th>
                                <th>Entidade</th>
                                <th>Centro de Custo</th>
                                <th style="text-align:right">Valor</th>
                                <th>Status</th>
                                <th style="text-align:right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="finance-tbody">
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="../js/theme.js"></script>
<script>
    document.querySelector('.menu-toggle')?.addEventListener('click', () => {
        document.querySelector('.sidebar')?.classList.toggle('is-open');
        document.querySelector('.sidebar-backdrop')?.classList.toggle('visible');
    });
    document.querySelector('.sidebar-backdrop')?.addEventListener('click', () => {
        document.querySelector('.sidebar')?.classList.remove('is-open');
        document.querySelector('.sidebar-backdrop')?.classList.remove('visible');
    });
</script>
<script src="../js/financeiro.js"></script>
</body>
</html>
